<!-- Project Detail Modal -->
  <div id="projectModal" class="project-modal" style="display: none;" aria-hidden="true">
    <div class="project-modal-overlay"></div>
    <div class="project-modal-content project-modal-frame" role="dialog" aria-modal="true" aria-label="Project details">
      <button type="button" class="project-modal-close" aria-label="Close modal">
        <i class="fas fa-times"></i>
      </button>
      <div class="project-modal-frame-body">
        <div class="project-modal-loading" data-project-modal-loading aria-hidden="true">
          <span class="project-modal-spinner"></span>
        </div>
        <iframe
          id="modalProjectFrame"
          class="project-modal-iframe"
          title="Project details"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>
    </div>
  </div>
