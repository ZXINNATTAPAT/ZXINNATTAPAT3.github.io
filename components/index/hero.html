  <script>
    (function () {
      var bar = document.querySelector('.ios-tabbar');
      if (!bar) return;
      if (bar.parentElement !== document.body) document.body.appendChild(bar);
      var tabs = Array.prototype.slice.call(bar.querySelectorAll('.ios-tab'));

      var hintTimer = null;

      function labelOf(tab) {
        var label = tab.querySelector('[data-i18n]');
        return label ? label.textContent.trim() : '';
      }

      function refreshHints() {
        tabs.forEach(function (tab) {
          tab.setAttribute('data-hint', labelOf(tab));
        });
      }

      function showHint() {
        refreshHints();
        bar.classList.add('is-hinting');
        clearTimeout(hintTimer);
        hintTimer = setTimeout(function () {
          bar.classList.remove('is-hinting');
        }, 1400);
      }

      function select(tab) {
        if (!tab) return;
        tabs.forEach(function (item) {
          var on = item === tab;
          item.classList.toggle('is-active', on);
          if (on) item.setAttribute('aria-current', 'page');
          else item.removeAttribute('aria-current');
        });
      }

      function sectionFor(tab) {
        var href = tab.getAttribute('href') || '';
        if (href.charAt(0) !== '#') return null;
        return document.querySelector(href);
      }

      function sync() {
        var marker = 96;
        var current = null;
        var best = -Infinity;
        tabs.forEach(function (tab) {
          var section = sectionFor(tab);
          if (!section) return;
          var top = section.getBoundingClientRect().top;
          if (top <= marker + 12 && top > best) {
            best = top;
            current = tab;
          }
        });
        select(current || tabs[0]);
      }

      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          if ((tab.getAttribute('href') || '').charAt(0) === '#') select(tab);
        });
      });

      window.addEventListener('scroll', function () {
        sync();
        showHint();
      }, { passive: true });
      window.addEventListener('hashchange', sync);
      window.addEventListener('i18n:updated', refreshHints);
      refreshHints();
      sync();
    })();
  </script>
  <script>
    // Toggle sticky-open for skill folders
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('.skill-folder').forEach(function (el) {
        const toggle = function () { el.classList.toggle('open'); };
        el.addEventListener('click', toggle);
        el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
      });
    });
  </script>
