  <div class="scroll-progress" role="presentation" aria-hidden="true"></div>
  <script>
    (function () {
      function closeLangMenu(menu) {
        var trigger = menu.querySelector('[data-lang-trigger]');
        var panel = menu.querySelector('[data-lang-panel]');
        menu.classList.remove('is-open');
        if (trigger) trigger.setAttribute('aria-expanded', 'false');
        if (panel) panel.hidden = true;
      }

      function renderLangMenus() {
        document.querySelectorAll('[data-lang-menu]').forEach(function (menu) {
          var select = menu.querySelector('select');
          if (!select) return;
          var current = menu.querySelector('[data-lang-current]');
          var selected = select.options[select.selectedIndex];
          if (current && selected) current.textContent = selected.textContent;
          menu.querySelectorAll('[data-lang]').forEach(function (button) {
            var active = button.getAttribute('data-lang') === select.value;
            button.classList.toggle('is-active', active);
            button.setAttribute('aria-selected', active ? 'true' : 'false');
          });
        });
      }

      document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('[data-lang-menu]').forEach(function (menu) {
          var select = menu.querySelector('select');
          var trigger = menu.querySelector('[data-lang-trigger]');
          var panel = menu.querySelector('[data-lang-panel]');
          if (!select) return;

          if (trigger && panel) {
            trigger.addEventListener('click', function (event) {
              event.stopPropagation();
              var open = !menu.classList.contains('is-open');
              document.querySelectorAll('[data-lang-menu].is-open').forEach(closeLangMenu);
              if (open) {
                menu.classList.add('is-open');
                trigger.setAttribute('aria-expanded', 'true');
                panel.hidden = false;
              }
            });
          }

          menu.querySelectorAll('[data-lang]').forEach(function (button) {
            button.addEventListener('click', function () {
              select.value = button.getAttribute('data-lang');
              select.dispatchEvent(new Event('change', { bubbles: true }));
              closeLangMenu(menu);
            });
          });
        });

        document.addEventListener('click', function (event) {
          document.querySelectorAll('[data-lang-menu].is-open').forEach(function (menu) {
            if (!menu.contains(event.target)) closeLangMenu(menu);
          });
        });

        document.addEventListener('keydown', function (event) {
          if (event.key !== 'Escape') return;
          document.querySelectorAll('[data-lang-menu].is-open').forEach(closeLangMenu);
        });

        renderLangMenus();
      });

      window.addEventListener('i18n:updated', renderLangMenus);
    })();
  </script>
