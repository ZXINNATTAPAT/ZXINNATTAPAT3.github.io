    <button type="button" class="skill-filter is-active" data-skill-filter="all" aria-pressed="true" data-i18n="skills.filterAll">All</button>
    <button type="button" class="skill-filter" data-skill-filter="frontend" aria-pressed="false" data-i18n="skills.filterFrontend">Frontend</button>
    <button type="button" class="skill-filter" data-skill-filter="backend" aria-pressed="false" data-i18n="skills.filterBackend">Backend</button>
    <button type="button" class="skill-filter" data-skill-filter="tools" aria-pressed="false" data-i18n="skills.filterTools">Tools</button>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var root = document.querySelector('.profile-skills-block');
    if (!root) return;
    var dock = root.querySelector('.app-dock');
    var items = Array.prototype.slice.call(root.querySelectorAll('.app-item'));
    var filters = root.querySelectorAll('.skill-filter');
    var motion = null;

    function iconOf(item) {
      return item.querySelector('.app-icon');
    }

    function reduced() {
      return window.matchMedia('(prefers-reduced-motion: reduce)').matches || typeof gsap === 'undefined';
    }

    function clearMotionStyles() {
      if (typeof gsap === 'undefined') return;
      gsap.set(items.concat(items.map(iconOf)), { clearProps: 'transform,opacity,visibility' });
    }

    function stopMotion() {
      if (motion) {
        motion.kill();
        motion = null;
      }
      clearMotionStyles();
      if (dock) dock.classList.remove('is-filtering');
    }

    function showGroup(group) {
      stopMotion();
      var leaving = [];
      var staying = [];
      var entering = [];
      items.forEach(function (item) {
        var match = group === 'all' || item.getAttribute('data-skill-group') === group;
        if (!item.hidden && !match) leaving.push(item);
        else if (!item.hidden && match) staying.push(item);
        else if (item.hidden && match) entering.push(item);
      });

      if (reduced() || (!leaving.length && !entering.length)) {
        items.forEach(function (item) {
          item.hidden = group !== 'all' && item.getAttribute('data-skill-group') !== group;
        });
        return;
      }

      var first = new Map();
      staying.forEach(function (item) {
        first.set(item, item.getBoundingClientRect());
      });

      dock.classList.add('is-filtering');
      motion = gsap.timeline({
        onComplete: function () {
          dock.classList.remove('is-filtering');
          clearMotionStyles();
          motion = null;
        }
      });

      if (leaving.length) {
        motion.to(leaving.map(iconOf), {
          autoAlpha: 0,
          scale: 0.82,
          duration: 0.22,
          stagger: { amount: Math.min(0.12, leaving.length * 0.012) },
          ease: 'power2.in'
        });
      }

      motion.call(function () {
        leaving.forEach(function (item) {
          item.hidden = true;
          gsap.set(iconOf(item), { clearProps: 'transform,opacity,visibility' });
        });
        entering.forEach(function (item) {
          item.hidden = false;
          gsap.set(iconOf(item), { autoAlpha: 0, scale: 0.82, y: 8 });
        });
        staying.forEach(function (item) {
          var prev = first.get(item);
          var next = item.getBoundingClientRect();
          var dx = prev.left - next.left;
          var dy = prev.top - next.top;
          if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
            gsap.set(item, { x: dx, y: dy });
          }
        });
        if (staying.length) {
          motion.to(staying, { x: 0, y: 0, duration: 0.46, ease: 'power3.out' });
        }
        if (entering.length) {
          motion.to(entering.map(iconOf), {
            autoAlpha: 1,
            scale: 1,
            y: 0,
            duration: 0.4,
            stagger: { each: 0.028, from: 'start' },
            ease: 'power2.out'
          }, staying.length ? '<' : undefined);
        }
      });
    }

    filters.forEach(function (button) {
      button.addEventListener('click', function () {
        if (button.getAttribute('aria-pressed') === 'true') return;
        var group = button.getAttribute('data-skill-filter');
        filters.forEach(function (item) {
          var active = item === button;
          item.classList.toggle('is-active', active);
          item.setAttribute('aria-pressed', active ? 'true' : 'false');
        });
        showGroup(group);
      });
    });
  });
</script>
