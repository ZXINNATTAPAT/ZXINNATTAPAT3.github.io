<section id="cloud-platforms" class="container-fluid cloud-platforms-section">
  <div class="container">
    <div class="cloud-platforms-shell">
      <div class="cloud-platforms-header">
        <span class="cloud-platforms-kicker" data-i18n="cloud.kicker">Deployment Picks</span>
        <h2 class="profile-heading playfair-400 mb-2" style="color: #2c2c2c" data-i18n="cloud.title">
          Cloud & Hosting
        </h2>
        <p class="cloud-platforms-description mb-0" data-i18n="cloud.description">
          Platforms I like using when shipping and hosting products.
        </p>
      </div>

      <div class="cloud-platforms-grid">
        <article class="cloud-platform-card cloud-platform-railway" aria-label="Railway">
          <div class="cloud-platform-brand">
            <span class="cloud-platform-mark">
              <img src="https://cdn.simpleicons.org/railway/0B0D0E" alt="Railway" width="48" height="48" loading="lazy" decoding="async" />
            </span>
            <span class="cloud-platform-name">Railway</span>
          </div>
        </article>

        <article class="cloud-platform-card cloud-platform-vercel" aria-label="Vercel">
          <div class="cloud-platform-brand">
            <span class="cloud-platform-mark">
              <img src="https://cdn.simpleicons.org/vercel/111111" alt="Vercel" width="48" height="48" loading="lazy" decoding="async" />
            </span>
            <span class="cloud-platform-name">Vercel</span>
          </div>
        </article>

        <article class="cloud-platform-card cloud-platform-netlify" aria-label="Netlify">
          <div class="cloud-platform-brand">
            <span class="cloud-platform-mark">
              <img src="https://cdn.simpleicons.org/netlify/00AD9F" alt="Netlify" width="48" height="48" loading="lazy" decoding="async" />
            </span>
            <span class="cloud-platform-name">Netlify</span>
          </div>
        </article>

        <article class="cloud-platform-card cloud-platform-render" aria-label="Render">
          <div class="cloud-platform-brand">
            <span class="cloud-platform-mark">
              <img src="https://cdn.simpleicons.org/render/000000" alt="Render" width="48" height="48" loading="lazy" decoding="async" />
            </span>
            <span class="cloud-platform-name">Render</span>
          </div>
        </article>

        <article class="cloud-platform-card cloud-platform-hostiger" aria-label="Hostiger">
          <div class="cloud-platform-brand">
            <span class="cloud-platform-mark">
              <img src="https://www.google.com/s2/favicons?sz=128&domain=hostiger.com" alt="Hostiger" width="48" height="48" loading="lazy" decoding="async" />
            </span>
            <span class="cloud-platform-name">Hostiger</span>
          </div>
        </article>

        <article class="cloud-platform-card cloud-platform-cloudflare" aria-label="Cloudflare">
          <div class="cloud-platform-brand">
            <span class="cloud-platform-mark">
              <img src="https://cdn.simpleicons.org/cloudflare/F38020" alt="Cloudflare" width="48" height="48" loading="lazy" decoding="async" />
            </span>
            <span class="cloud-platform-name">Cloudflare</span>
          </div>
        </article>
      </div>
    </div>
  </div>
</section>
