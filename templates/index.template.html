  <!-- Project Modal Popup Script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const modal = document.getElementById('projectModal');
      if (!modal) return;

      const modalOverlay = modal.querySelector('.project-modal-overlay');
      const modalClose = modal.querySelector('.project-modal-close');
      const modalFrame = document.getElementById('modalProjectFrame');
      const modalLoading = modal.querySelector('[data-project-modal-loading]');

      function showLoading(isLoading) {
        if (!modalLoading) return;
        modalLoading.classList.toggle('is-visible', Boolean(isLoading));
        modalLoading.setAttribute('aria-hidden', isLoading ? 'false' : 'true');
      }

      function openModal(card) {
        if (!card || !modalFrame) return;

        const pageUrl = card.getAttribute('data-page-url')
          || (card.getAttribute('data-project') ? `projects/${card.getAttribute('data-project')}.html?embed=1` : '');
        const title = card.getAttribute('data-title') || 'Project details';

        if (!pageUrl) return;

        modalFrame.title = title;
        showLoading(true);
        modalFrame.onload = function() {
          showLoading(false);
        };
        modalFrame.src = pageUrl;

        modal.style.display = 'block';
        modal.setAttribute('aria-hidden', 'false');
        void modal.offsetWidth;
        modal.classList.add('modal-active');
        document.body.style.overflow = 'hidden';

        if (window.matchMedia('(max-width: 768px)').matches) {
          modalClose.focus();
        }
      }

      function closeModal() {
        modal.classList.remove('modal-active');
        modal.setAttribute('aria-hidden', 'true');
        setTimeout(() => {
          modal.style.display = 'none';
          document.body.style.overflow = '';
          if (modalFrame) {
            modalFrame.onload = null;
            modalFrame.src = 'about:blank';
          }
          showLoading(false);
        }, 300);
      }

      window.openProjectModal = openModal;
      window.closeProjectModal = closeModal;

      document.addEventListener('click', (e) => {
        const card = e.target.closest('.project-card-clickable');
        if (!card) return;
        if (card.dataset.dragIgnore === '1') {
          card.dataset.dragIgnore = '0';
          return;
        }
        if (e.target.closest('a') || e.target.closest('button')) {
          return;
        }
        e.preventDefault();
        openModal(card);
      });

      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        const card = e.target.closest && e.target.closest('.project-card-clickable');
        if (!card) return;
        e.preventDefault();
        openModal(card);
      });

      modalClose.addEventListener('click', closeModal);
      modalOverlay.addEventListener('click', closeModal);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.classList.contains('modal-active')) {
          closeModal();
        }
      });
    });
  </script>

  <!-- Navigation UX Enhancements -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const progressBar = document.querySelector('.scroll-progress');
      const navBar = document.querySelector('nav.sticky-top');
      const navLinks = document.querySelectorAll('.nav-link-ux');

      const navTargets = Array.from(navLinks)
        .map(link => {
          const href = link.getAttribute('href');
          if (!href || !href.startsWith('#')) return null;
          const target = document.querySelector(href);
          if (!target) return null;
          return { link, target };
        })
        .filter(Boolean);

      const updateProgress = () => {
        if (!progressBar) return;
        const scrollTop = window.scrollY;
        const docHeight = document.body.scrollHeight - window.innerHeight;
        const progress = docHeight > 0 ? Math.min((scrollTop / docHeight) * 100, 100) : 0;
        progressBar.style.width = `${progress}%`;
      };

      const updateNavState = () => {
        const triggerLine = window.scrollY + window.innerHeight * 0.35;
        let activeLink = null;

        navTargets.forEach(({ link, target }) => {
          const top = target.offsetTop;
          const bottom = top + target.offsetHeight;
          if (triggerLine >= top && triggerLine < bottom) {
            activeLink = link;
          }
        });

        navLinks.forEach(link => {
          link.classList.toggle('active', link === activeLink);
        });
      };

      const handleScrollState = () => {
        updateProgress();
        updateNavState();
        if (navBar) {
          navBar.classList.toggle('nav-scrolled', window.scrollY > 24);
        }
      };

      updateProgress();
      updateNavState();
      handleScrollState();

      window.addEventListener('scroll', handleScrollState, { passive: true });
      window.addEventListener('resize', updateProgress);
    });
  </script>

  <!-- Lightweight Visual Highlights Animation - Vanilla JS + CSS -->
  <script>
    (function() {
      'use strict';
      
      const visualHighlightSection = document.getElementById('portfolio');
      if (!visualHighlightSection) return;

      const carousel = visualHighlightSection.querySelector('[data-portfolio-carousel]');
      const track = visualHighlightSection.querySelector('[data-portfolio-track]');
      const slides = Array.from(visualHighlightSection.querySelectorAll('.carousel-slide'));
      const cards = Array.from(visualHighlightSection.querySelectorAll('.ios-project-card'));
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      cards.forEach((card, index) => {
        card.style.transitionDelay = `${index * 80}ms`;

        if (prefersReducedMotion) {
          return;
        }

        const resetCard = function() {
          card.style.setProperty('--glass-rotate-x', '0deg');
          card.style.setProperty('--glass-rotate-y', '0deg');
          card.style.setProperty('--glass-shine-x', '24%');
          card.style.setProperty('--glass-shine-y', '12%');
          card.style.setProperty('--image-shift-x', '0px');
          card.style.setProperty('--image-shift-y', '0px');
        };

        let rafId = null;

        const updateCard = function(event) {
          const rect = card.getBoundingClientRect();
          const px = Math.min(Math.max((event.clientX - rect.left) / rect.width, 0), 1);
          const py = Math.min(Math.max((event.clientY - rect.top) / rect.height, 0), 1);
          const rotateY = (px - 0.5) * 8;
          const rotateX = (0.5 - py) * 7;

          card.style.setProperty('--glass-rotate-x', `${rotateX}deg`);
          card.style.setProperty('--glass-rotate-y', `${rotateY}deg`);
          card.style.setProperty('--glass-shine-x', `${px * 100}%`);
          card.style.setProperty('--glass-shine-y', `${py * 100}%`);
          card.style.setProperty('--image-shift-x', `${(px - 0.5) * 10}px`);
          card.style.setProperty('--image-shift-y', `${(py - 0.5) * 8}px`);
        };

        resetCard();

        card.addEventListener('pointermove', function(event) {
          if (!card.classList.contains('is-visible')) return;
          if (rafId) cancelAnimationFrame(rafId);
          rafId = requestAnimationFrame(function() {
            updateCard(event);
          });
        });

        card.addEventListener('pointerleave', function() {
          if (rafId) cancelAnimationFrame(rafId);
          resetCard();
        });

        card.addEventListener('pointercancel', resetCard);
        card.addEventListener('blur', resetCard);
      });

      const revealCard = function(card) {
        card.classList.add('is-visible');
        if (prefersReducedMotion) {
          card.style.removeProperty('transition-delay');
        }
      };

      if (prefersReducedMotion) {
        cards.forEach((card) => {
          card.classList.add('is-visible');
          card.style.transitionDelay = '0ms';
        });
      } else if ('IntersectionObserver' in window) {
        const cardObserver = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting) {
              revealCard(entry.target);
              cardObserver.unobserve(entry.target);
            }
          });
        }, {
          root: carousel || null,
          threshold: 0.15,
          rootMargin: '0px 40px 0px 40px'
        });

        cards.forEach(function(card) {
          cardObserver.observe(card);
        });
      } else {
        window.addEventListener('load', function() {
          cards.forEach(function(card) {
            setTimeout(function() {
              revealCard(card);
            }, 80);
          });
        });
      }

      if (!carousel || !track || !slides.length) {
        return;
      }

      carousel.querySelectorAll('img').forEach(function(image) {
        image.draggable = false;
      });

      const DRAG_THRESHOLD = 12;
      let isPointerDown = false;
      let isDragging = false;
      let pointerId = null;
      let startX = 0;
      let startScrollLeft = 0;
      let activeCard = null;

      const getSlideStep = function() {
        const firstSlide = slides[0];
        if (!firstSlide) return carousel.clientWidth * 0.8;
        const styles = window.getComputedStyle(track);
        const gap = parseFloat(styles.columnGap || styles.gap) || 0;
        return firstSlide.getBoundingClientRect().width + gap;
      };

      const scrollBySlide = function(direction) {
        carousel.scrollBy({
          left: getSlideStep() * direction,
          behavior: prefersReducedMotion ? 'auto' : 'smooth'
        });
      };

      carousel.addEventListener('dragstart', function(event) {
        event.preventDefault();
      });

      carousel.addEventListener('pointerdown', function(event) {
        if (event.pointerType === 'mouse' && event.button !== 0) return;

        isPointerDown = true;
        isDragging = false;
        pointerId = event.pointerId;
        startX = event.clientX;
        startScrollLeft = carousel.scrollLeft;
        activeCard = event.target.closest('.project-card-clickable');
      });

      carousel.addEventListener('pointermove', function(event) {
        if (!isPointerDown || pointerId !== event.pointerId) return;

        const delta = event.clientX - startX;

        if (!isDragging && Math.abs(delta) > DRAG_THRESHOLD) {
          isDragging = true;
          carousel.classList.add('is-dragging');
          try {
            carousel.setPointerCapture(event.pointerId);
          } catch (err) {
            // Ignore capture errors on unsupported targets
          }
        }

        if (!isDragging) return;

        carousel.scrollLeft = startScrollLeft - delta;
        event.preventDefault();
      });

      const endPointer = function(event) {
        if (!isPointerDown || (event && pointerId !== null && event.pointerId !== pointerId)) {
          return;
        }

        const card = activeCard;
        const wasDragging = isDragging;

        if (pointerId !== null && carousel.hasPointerCapture(pointerId)) {
          carousel.releasePointerCapture(pointerId);
        }

        isPointerDown = false;
        isDragging = false;
        pointerId = null;
        activeCard = null;
        carousel.classList.remove('is-dragging');

        if (wasDragging) {
          if (card) {
            card.dataset.dragIgnore = '1';
          }
          return;
        }

        if (card && typeof window.openProjectModal === 'function') {
          card.dataset.dragIgnore = '1';
          window.openProjectModal(card);
        }
      };

      carousel.addEventListener('pointerup', endPointer);
      carousel.addEventListener('pointercancel', endPointer);

      carousel.addEventListener('click', function(event) {
        const card = event.target.closest('.project-card-clickable');
        if (!card || card.dataset.dragIgnore !== '1') return;
        event.preventDefault();
        event.stopPropagation();
        card.dataset.dragIgnore = '0';
      }, true);

      carousel.addEventListener('keydown', function(event) {
        if (event.key === 'ArrowLeft') {
          event.preventDefault();
          scrollBySlide(-1);
        } else if (event.key === 'ArrowRight') {
          event.preventDefault();
          scrollBySlide(1);
        }
      });
    })();
  </script>

  <!-- Mobile Menu Script -->
  <script>
    (function() {
      'use strict';
      
      const mobileMenuToggle = document.getElementById('mobileMenuToggle');
      const mobileMenu = document.getElementById('mobileMenu');
      const body = document.body;
      
      if (!mobileMenuToggle || !mobileMenu) return;
      
      function toggleMobileMenu() {
        const isActive = mobileMenu.classList.contains('active');
        
        if (isActive) {
          closeMobileMenu();
        } else {
          openMobileMenu();
        }
      }
      
      function openMobileMenu() {
        mobileMenu.querySelectorAll('.mobile-nav-link').forEach(function(link) {
          link.classList.remove('active');
        });
        mobileMenu.classList.add('active');
        mobileMenuToggle.classList.add('active');
        mobileMenuToggle.setAttribute('aria-expanded', 'true');
        body.classList.add('menu-open');
      }
      
      function closeMobileMenu() {
        mobileMenu.classList.remove('active');
        mobileMenuToggle.classList.remove('active');
        mobileMenuToggle.setAttribute('aria-expanded', 'false');
        body.classList.remove('menu-open');
      }
      
      // Toggle menu on button click
      mobileMenuToggle.addEventListener('click', function(e) {
        e.stopPropagation();
        toggleMobileMenu();
      });
      
      // Close menu when clicking outside
      document.addEventListener('click', function(e) {
        if (mobileMenu.classList.contains('active')) {
          if (!mobileMenu.contains(e.target) && !mobileMenuToggle.contains(e.target)) {
            closeMobileMenu();
          }
        }
      });
      
      // Close menu on escape key
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && mobileMenu.classList.contains('active')) {
          closeMobileMenu();
        }
      });
      
      // Close menu on window resize (if resizing to desktop)
      let resizeTimer;
      window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function() {
          if (window.innerWidth >= 992 && mobileMenu.classList.contains('active')) {
            closeMobileMenu();
          }
        }, 250);
      });
      
      // Make closeMobileMenu available globally for onclick handlers
      window.closeMobileMenu = closeMobileMenu;
      
      // Update active nav link on scroll
      function updateActiveNavLink() {
        const sections = document.querySelectorAll('section[id], header[id]');
        const navLinks = document.querySelectorAll('.nav-link-ux');
        
        let current = '';
        sections.forEach(function(section) {
          const sectionTop = section.offsetTop;
          const sectionHeight = section.clientHeight;
          if (window.pageYOffset >= sectionTop - 100) {
            current = section.getAttribute('id');
          }
        });
        
        navLinks.forEach(function(link) {
          link.classList.remove('active');
          if (link.getAttribute('href') === '#' + current || 
              (current === 'home' && link.getAttribute('href') === '#home')) {
            link.classList.add('active');
          }
        });
      }
      
      // Update active link on scroll
      window.addEventListener('scroll', function() {
        updateActiveNavLink();
      });
      
      // Initial update
      updateActiveNavLink();
    })();
  </script>

  <!-- AOS Animation Init -->
  <script>
    // Initialize AOS with proper loading check
    function initAOS() {
      if (typeof AOS !== 'undefined') {
        AOS.init({
          once: true,
          duration: 400,        // Balanced duration for smooth animation
          offset: 80,            // Trigger when element is 80px from viewport
          delay: 0,              // No delay by default (individual elements can override)
          easing: 'ease-out',    // Smooth easing
          startEvent: 'DOMContentLoaded', // Start on DOM ready
          disable: false,        // Enable on all devices
          useClassNames: false,  // Don't use class names for performance
          disableMutationObserver: false, // Enable mutation observer for dynamic content
          debounceDelay: 50,     // Debounce delay for resize/scroll
          throttleDelay: 99,     // Throttle delay for scroll
        });
        
        // Refresh AOS after page fully loads to catch any missed elements
        window.addEventListener('load', function() {
          if (typeof AOS !== 'undefined') {
            AOS.refresh();
          }
        });
        
        // Refresh AOS on resize to recalculate positions
        let resizeTimer;
        window.addEventListener('resize', function() {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(function() {
            if (typeof AOS !== 'undefined') {
              AOS.refresh();
            }
          }, 150);
        });
      } else {
        // Retry if AOS not loaded yet (due to defer)
        setTimeout(initAOS, 50);
      }
    }
    
    // Start initialization after loading screen is hidden
    function startAOS() {
      if (document.body.classList.contains('loaded')) {
        initAOS();
      } else {
        // Wait for body to have 'loaded' class
        const observer = new MutationObserver(function(mutations) {
          if (document.body.classList.contains('loaded')) {
            initAOS();
            observer.disconnect();
          }
        });
        observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });
        
        // Fallback timeout
        setTimeout(initAOS, 1000);
      }
    }
    
    // Start initialization
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startAOS);
    } else {
      startAOS();
    }
  </script>
